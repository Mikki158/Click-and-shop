server {
    listen 80;

    server_name localhost;

    # Прокси для первого приложения
    location /api/product/ {
        proxy_pass http://product-service:8081;  # Перенаправляем запросы на контейнер app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси для второго приложения
    location /api/files/ {
        proxy_pass http://image-service:8082;  # Перенаправляем запросы на контейнер another_app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

