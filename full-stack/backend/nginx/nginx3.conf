user  nginx;
worker_processes  auto;

error_log  /log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
	worker_connections  1024;
}


http {

	include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
	
	access_log /log/nginx/access.log custom;

        sendfile        on;
        #tcp_nopush     on;

        keepalive_timeout  65;

        #gzip  on;

	server {
		listen 80;
		server_name click-and-shop.ru;

		# Редирект HTTP на HTTPS
		return 301 https://$host$request_uri;
	}
	server {
		include /etc/nginx/conf.d/*.conf;

		listen 443 ssl;

		server_name click-and-shop.ru;
			
		ssl_certificate /etc/letsencrypt/live/click-and-shop.ru/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/click-and-shop.ru/privkey.pem;

		root /usr/share/nginx/html;
		index index.html;

		location / {
			proxy_pass http://react-container:5173; # Замените порт на тот, который используется вашим фронтендом
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_set_header Host $host;
			proxy_cache_bypass $http_upgrade;
		}

		location = /api/auth/TG_auth {
                        proxy_pass http://auth-container:8080; # порт приложения внутри контейнера
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }

		location = /api/auth/validate-token {
                        proxy_pass http://auth-container:8080; # порт приложения внутри контейнера
