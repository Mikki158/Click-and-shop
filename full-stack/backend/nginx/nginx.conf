events {}

http {
    # Определяем upstream для product-service
    upstream product_service {
        server product:8081;  # Используем имя контейнера как хост
    }

    # Определяем upstream для image-service
    upstream image_service {
        server image:8082;  # Используем имя контейнера как хост
    }

    # Настраиваем сервер для маршрутизации
    server {
        listen 80;

        # Прокси для product-service
        location /api/product/ {
            proxy_pass http://product_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Прокси для image-service
        location /api/files/ {
            proxy_pass http://image_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

