version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - product-service
      - image-service
      # Добавь другие сервисы по мере необходимости

  product-service:
    image: product_app
    container_name: product
    ports:
      - "8081:8081"
    # Настрой другие параметры сервис1

  image-service:
    image: image_app
    container_name: image
    ports:
      - "8082:8082"
    # Настрой другие параметры сервис2

  # Добавь другие микросервисы здесь

